<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>NXP: Neon District</title><style>
*{box-sizing:border-box;touch-action:none}body{margin:0;background:#050713;color:#eaf7ff;font-family:system-ui;overflow:hidden}#wrap{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto;background:#070b18}.hud{height:92px;padding:9px 12px;background:#0b1225;border-bottom:1px solid #253a65}.top{display:flex;justify-content:space-between;font-weight:800}.cyan{color:#64eaff}.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:7px}.label{font-size:11px;color:#a9b6d1}.bar{height:9px;background:#02040b;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#55ffa0,#24d8ff)}#xpFill{background:linear-gradient(90deg,#28dfff,#8d5cff)}#game{position:relative;flex:1;min-height:0;background:#050713}canvas{width:100%;height:100%;display:block}.mission{position:absolute;top:10px;left:10px;right:10px;background:#071020dd;border:1px solid #29406d;border-radius:12px;padding:8px 10px;font-size:13px;pointer-events:none}.controls{position:absolute;left:0;right:0;bottom:10px;height:150px;pointer-events:none}.joy{position:absolute;left:18px;bottom:8px;width:132px;height:132px;border-radius:50%;border:2px solid #4bdfff66;background:#0b193b88;pointer-events:auto}.knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:#5cecffaa}.attack{position:absolute;right:22px;bottom:22px;width:88px;height:88px;border-radius:50%;border:2px solid #ff5c9e;background:#511c47cc;color:white;font-weight:900;font-size:16px;pointer-events:auto}.dash{position:absolute;right:122px;bottom:86px;width:62px;height:62px;border-radius:50%;border:1px solid #6cf;background:#17305dcc;color:white;font-weight:800;pointer-events:auto}#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#071020ee;border:1px solid #51e9ff;border-radius:16px;padding:18px;text-align:center;display:none;z-index:5}#msg button{margin-top:10px;padding:10px 18px;border:0;border-radius:10px;background:#5deaff;font-weight:900}.small{font-size:12px;color:#9eb0cf}
</style></head><body><div id="wrap"><div class="hud"><div class="top"><span class="cyan">NXP // NEON DISTRICT</span><span id="rank">LV 1 • Rookie</span></div><div class="bars"><div><div class="label">CAN <span id="hpTxt">100</span></div><div class="bar"><div id="hpFill" class="fill"></div></div></div><div><div class="label">XP <span id="xpTxt">0/100</span></div><div class="bar"><div id="xpFill" class="fill"></div></div></div></div><div class="small">Kredi: <b id="credits">0</b> • Düşman: <b id="kills">0</b>/8 • Veri Çekirdeği: <b id="cores">0</b>/3</div></div>
<div id="game"><canvas id="c"></canvas><div class="mission" id="mission">🎯 Görev: Neon District'i temizle — 8 düşmanı etkisiz hale getir ve 3 veri çekirdeğini topla.</div><div class="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="dash" id="dash">DASH</button><button class="attack" id="attack">ATEŞ</button></div><div id="msg"></div></div></div>
<script>
const KEY="nxpCampaignV1",cv=document.getElementById("c"),ctx=cv.getContext("2d");let W,H,dpr,keys={},joy={x:0,y:0},bullets=[],enemies=[],cores=[],particles=[],last=0,boss=null,won=false;
let save=Object.assign({level:1,xp:0,credits:0,zone:1,bestKills:0},JSON.parse(localStorage.getItem(KEY)||"{}"));let p={x:180,y:300,r:14,hp:100,speed:185,kills:0,cores:0,fire:0,dash:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function spawn(){enemies=[];for(let i=0;i<8;i++)enemies.push({x:120+Math.random()*(W-180),y:150+Math.random()*(H-230),r:13,hp:45,spd:45+Math.random()*25});cores=[];for(let i=0;i<3;i++)cores.push({x:80+Math.random()*(W-130),y:140+Math.random()*(H-210),got:false})}spawn();
function need(){return 100+(save.level-1)*35}function persist(){localStorage.setItem(KEY,JSON.stringify(save))}
function shoot(){if(p.fire>0||won)return;p.fire=.24;let target=null,bd=9999;for(const e of enemies){let d=Math.hypot(e.x-p.x,e.y-p.y);if(d<bd){bd=d;target=e}}if(boss&&Math.hypot(boss.x-p.x,boss.y-p.y)<bd)target=boss;let a=target?Math.atan2(target.y-p.y,target.x-p.x):-Math.PI/2;bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,r:4})}
function addXP(n){save.xp+=n;while(save.xp>=need()){save.xp-=need();save.level++;p.hp=100}persist()}
function hitEnemy(e,d){e.hp-=d;for(let i=0;i<5;i++)particles.push({x:e.x,y:e.y,t:.4});if(e.hp<=0){if(e===boss){boss=null;win()}else{let i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);p.kills++;save.credits+=8;addXP(12);if(p.kills>=8&&p.cores>=3&&!boss)boss={x:W/2,y:110,r:28,hp:220,spd:55,boss:true}}}}
function win(){won=true;save.zone=Math.max(save.zone,2);save.credits+=80;addXP(90);persist();show("🏆 NEON DISTRICT FETHEDİLDİ!<br><span class='small'>Data Wasteland açıldı • +90 XP • +80 kredi</span>")}
function show(t){let m=document.getElementById("msg");m.innerHTML=t+"<br><button onclick='location.reload()'>Devam Et</button>";m.style.display="block"}
function update(dt){if(won)return;p.fire=Math.max(0,p.fire-dt);p.dash=Math.max(0,p.dash-dt);let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x,dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y,l=Math.hypot(dx,dy)||1,sp=p.speed*(p.dash>0?2.1:1);p.x=Math.max(18,Math.min(W-18,p.x+dx/l*sp*dt));p.y=Math.max(95,Math.min(H-18,p.y+dy/l*sp*dt));
for(const c of cores)if(!c.got&&Math.hypot(c.x-p.x,c.y-p.y)<25){c.got=true;p.cores++;save.credits+=10;addXP(8)}
for(const e of [...enemies,boss].filter(Boolean)){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.spd*dt;e.y+=Math.sin(a)*e.spd*dt;if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r){p.hp-=18*dt;if(p.hp<=0){p.hp=0;show("💀 Operasyon başarısız.<br><span class='small'>Kazandığın XP ve krediler kayıtlı.</span>");won=true}}}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;for(const e of [...enemies,boss].filter(Boolean))if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){hitEnemy(e,25);b.dead=true;break}if(b.x<0||b.x>W||b.y<0||b.y>H)b.dead=true}bullets=bullets.filter(b=>!b.dead);for(const q of particles)q.t-=dt;particles=particles.filter(q=>q.t>0);hud()}
function hud(){hpTxt.textContent=Math.ceil(p.hp);hpFill.style.width=p.hp+"%";xpTxt.textContent=save.xp+"/"+need();xpFill.style.width=save.xp/need()*100+"%";credits.textContent=save.credits;kills.textContent=p.kills;cores.textContent=p.cores;rank.textContent="LV "+save.level+" • "+(save.level>=6?"Elite":save.level>=3?"Operative":"Rookie");mission.textContent=boss?"⚠️ BOSS: Neon Warden'ı yen ve bölgeyi fethet!":"🎯 Görev: "+p.kills+"/8 düşman • "+p.cores+"/3 veri çekirdeği"}
function draw(){ctx.fillStyle="#050713";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#122448";ctx.lineWidth=1;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=80;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle="#10264a";for(let i=0;i<7;i++)ctx.fillRect((i*113)%W,110+(i*97)%(H-180),50,30);
for(const c of cores)if(!c.got){ctx.fillStyle="#66f7ff";ctx.shadowBlur=15;ctx.shadowColor="#66f7ff";ctx.fillRect(c.x-8,c.y-8,16,16);ctx.shadowBlur=0}
ctx.fillStyle="#59eaff";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.fillStyle="#ff4f87";for(const e of enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill()}if(boss){ctx.fillStyle="#b15cff";ctx.beginPath();ctx.arc(boss.x,boss.y,boss.r,0,7);ctx.fill();ctx.fillStyle="white";ctx.font="bold 12px system-ui";ctx.fillText("NEON WARDEN",boss.x-46,boss.y-38)}
ctx.fillStyle="#fff";for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}ctx.fillStyle="#6ff";for(const q of particles){ctx.globalAlpha=q.t/.4;ctx.fillRect(q.x-3,q.y-3,6,6)}ctx.globalAlpha=1}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener("keydown",e=>{keys[e.key]=1;if(e.key===" ")shoot()});addEventListener("keyup",e=>keys[e.key]=0);attack.onpointerdown=shoot;dash.onpointerdown=()=>{if(p.dash<=0)p.dash=.55};
let jid=null;function jm(e){let r=joyEl.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),l=Math.hypot(x,y),m=43;if(l>m){x=x/l*m;y=y/l*m}knob.style.transform="translate("+x+"px,"+y+"px)";joy.x=x/m;joy.y=y/m}const joyEl=document.getElementById("joy");joyEl.onpointerdown=e=>{jid=e.pointerId;joyEl.setPointerCapture(jid);jm(e)};joyEl.onpointermove=e=>{if(e.pointerId===jid)jm(e)};joyEl.onpointerup=()=>{jid=null;joy.x=joy.y=0;knob.style.transform=""};hud();
</script></body></html>
